# Proof or Bluff — production VPS stack
#
# Host: Hostinger KVM 2 (2 vCPU / 8 GB), shared with TaskFence Ai.
# Deployed at /opt/prooforbluff on the server. This file is the source of truth;
# copy it there with ops/vps/deploy.sh, never hand-edit on the box.
#
# Resource policy (John, Oct 3 2026): "POB wins the fight, TaskFence stays alive."
#   - TaskFence containers were lowered to cpu_shares 256 (docker update).
#   - POB proof server runs at cpu_shares 2048 → ~8x CPU priority under contention.
#   - cpu_shares only matter when both want CPU at once; idle POB = TaskFence
#     has the whole machine.
#   - Memory: TaskFence is capped at 2.75 GiB total (its own limits). POB proof
#     server is capped at 4.5 GiB. 7.8 GiB RAM total → ~0.5 GiB headroom for OS.
#
# Services:
#   proof-server  Midnight proof server 8.1.0 (public-network matrix, Oct 2026).
#                 Sees private witnesses during proving. Never logs them.
#   pob-api       Node 22 — the wallet-free sponsored game backend
#                 (realDeal/cli/src/sponsored-service.js, docs/SPONSORED_GAME_API.md).
#                 Plays the bot seat, holds the operator wallet, pays all DUST,
#                 proves through proof-server. Built from ./src (see below).
#   caddy         TLS termination + origin-locked CORS for proof.prooforbluff.app
#                 and api.prooforbluff.app (→ pob-api).
#
# Secrets: pob-api reads ./pob-api.env (operator seed, Blockfrost token, state
# password). That file is created BY HAND on the box and is gitignored
# (ops/vps/.gitignore). deploy.sh copies a local one only if it exists.

name: prooforbluff

services:
  proof-server:
    # Tag pinned to the proof server version in the current Midnight support
    # matrix. Bump only together with ledger/compact/midnight.js versions.
    image: midnightntwrk/proof-server:8.1.0
    container_name: pob-proof-server
    restart: unless-stopped
    # The image's ENTRYPOINT is `bash -c <single string>`, so CLI flags passed as
    # a compose array are silently dropped (verified Oct 3 2026: /ready showed
    # jobCapacity 0). Configure via env vars instead — each flag has one.
    #   num_workers 1 (Oct 3 2026): ONE closeGame job needs ~9-10 GiB RSS —
    #     two concurrent jobs would OOM even on the 16 GiB box. Serialize;
    #     jobs queue under job-capacity instead of racing for RAM. Revisit to
    #     2 only on a ≥24 GiB host.
    #   job-capacity 10: beyond that, clients get HTTP 429 instead of OOMing us.
    #   job-timeout 600: the rollup closeGame proof may be large; 10 min ceiling.
    environment:
      MIDNIGHT_PROOF_SERVER_PORT: "6300"
      MIDNIGHT_PROOF_SERVER_NUM_WORKERS: "1"
      MIDNIGHT_PROOF_SERVER_JOB_CAPACITY: "10"
      MIDNIGHT_PROOF_SERVER_JOB_TIMEOUT: "600"
    command: ["midnight-proof-server"]
    # Only Caddy talks to it; not published on the host.
    expose:
      - "6300"
    volumes:
      # Cache fetched public params / proving keys across restarts.
      - proof-params:/root/.cache/midnight
    cpu_shares: 2048
    # Sized for the v3p per-round rollup (Season 1): a proveRound job peaks
    # ~1.3 GiB RSS (measured Oct 2026), so 4.5 GiB is a generous ceiling on the
    # 8 GiB box and leaves room for pob-api (1.5 GiB) + TaskFence (~2.75 GiB)
    # + OS/Caddy. The old v2 closeGame needed 9-10 GiB and is NOT proven here.
    # Never set this above physical RAM: that disables the cgroup guardrail and
    # a runaway job would OOM at the SYSTEM level (risking sshd/TaskFence).
    mem_limit: 4608m
    healthcheck:
      # The proof-server image is distroless — no sh/bash/curl/wget, so no
      # exec-based healthcheck can ever run inside it (failing streak 475+).
      # Real health is observed through Caddy proxying /ready.
      disable: true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  pob-api:
    # Built on the box, not pulled: there is no registry for this image and the
    # build needs the gitignored proving keys from the dev machine's working
    # tree. deploy.sh rsyncs the exact source subtrees the Dockerfile COPYs
    # into ./src (= /opt/prooforbluff/src) and then runs `compose build`.
    # The context is ./src rather than the repo root so the box never needs a
    # git checkout AND so Docker is not handed the multi-GB node_modules /
    # media / docs trees as build context. The Dockerfile sits one level up
    # (synced next to this file), which Docker allows.
    build:
      context: ./src
      dockerfile: ../pob-api.Dockerfile
    image: prooforbluff/pob-api:local
    container_name: pob-api
    restart: unless-stopped
    # Secrets + network config live in ./pob-api.env on the box (NEVER committed;
    # listed in ops/vps/.gitignore). Expected contents:
    #   POB_NETWORK_ID=mainnet
    #   POB_PUBLIC_SEED_MAINNET_P2=<64 hex — operator wallet, funded with NIGHT+DUST>
    #   BLOCKFROST_PROJECT_ID=<midnight-mainnet project id>
    #   POB_PRIVATE_STATE_PASSWORD=<≥16 chars — encrypts the level private-state db>
    #   POB_PROOF_SERVER=http://proof-server:6300     # compose DNS name, in-network
    #   POB_SPONSORED_STATE_DIR=/state                # the volume below
    #   POB_ALLOWED_ORIGINS=https://prooforbluff.app  # bare origins, comma-separated
    #   POB_API_HOST=0.0.0.0                          # see note below
    #   POB_STATE_NAMESPACE=mainnet-sponsored         # slug → /state/.pob-state/<slug>
    # POB_API_HOST: the service binds 127.0.0.1 by default (safe for bare
    # metal). Here Caddy is a different container, so it must bind all
    # container interfaces. That is still private — `expose` below puts the
    # port on the compose network only, nothing is published on the host.
    env_file:
      - ./pob-api.env
    # Only Caddy talks to it (api.prooforbluff.app → pob-api:3020).
    expose:
      - "3020"
    volumes:
      # Everything mutable: the resumable chain-step queue (pending/ + done/),
      # the level private-state db and state.js' .pob-state/<namespace>. Losing
      # this volume = losing which in-flight proofs were submitted. Keep it.
      - pob-api-state:/state
    # Below the proof server (2048) and level with Caddy: the API itself is
    # cheap (a few ms per move); the heavy lifting happens in proof-server.
    cpu_shares: 1024
    # The wallet-sdk + ledger WASM + an in-memory game table for ≤200 games
    # sits around 400–700 MiB RSS; 1.5 GiB leaves room for the proving-key
    # buffers midnight-js builds while inlining them into /prove payloads.
    mem_limit: 1536m
    depends_on:
      - proof-server
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    container_name: pob-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # Let's Encrypt certs — persist them!
      - caddy-config:/config
    cpu_shares: 1024
    mem_limit: 256m
    depends_on:
      - proof-server
      - pob-api
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  proof-params:
  caddy-data:
  caddy-config:
  pob-api-state:
